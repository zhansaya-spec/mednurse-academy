<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedNurse Academy · СД-381</title><style>:root{font-family:system-ui,Arial;background:#eef4f8;color:#183044}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:22px}header{background:#0b5670;color:white;padding:22px;border-radius:0 0 18px 18px}header .wrap{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{margin:0;font-size:26px}button,select,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #b9cbd3}button{background:#087c91;color:white;border:0;cursor:pointer}button:disabled{background:#a6b6bc;cursor:not-allowed}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #173d4a14}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.tile{background:#eaf5f7;border-radius:12px;padding:14px}.muted{color:#587280}.pill{display:inline-block;background:#d8f3e9;padding:5px 9px;border-radius:30px}.options{display:grid;gap:9px}.options button{text-align:left;background:#eef5f8;color:#183044;border:1px solid #bbd1db}.options button:hover{background:#d8edf2}.options button.selected{background:#b4e3ef;border:2px solid #087c91}.hide{display:none}#feedback{padding:12px;border-radius:9px;margin-top:12px;background:#e9f5f8}.bar{background:#d7e6ea;border-radius:10px;height:12px;overflow:hidden}.bar span{display:block;height:100%;background:#12a48f}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}footer{padding:22px;text-align:center;color:#587280}label{display:block;margin:9px 0 4px}nav{display:flex;flex-wrap:wrap;gap:8px}nav button{background:#e3eff3;color:#164459}nav button.active{background:#087c91;color:white}.q{font-size:18px;font-weight:650}.small{font-size:13px}.notice{background:#fff4dc;padding:12px;border-radius:10px}</style></head><body><header><div class="wrap"><div><h1>🩺 MedNurse Academy</h1><div id="subtitle">Реабилитология · СД-381</div></div><select id="lang" aria-label="Language"><option value="ru">Русский</option><option value="kk">Қазақша</option></select></div></header><main class="wrap"><section class="card" id="login"><h2 data-i="welcome">Вход студента</h2><label data-i="name">Фамилия и имя</label><input id="student" autocomplete="name" maxlength="90" placeholder="Фамилия Имя"><label data-i="code">Индивидуальный код (выдаёт преподаватель)</label><input id="code" maxlength="40" placeholder="Код студента"><p class="small muted" data-i="privacy">Используйте учебный код, а не ИИН. Не вводите данные пациентов.</p><button id="enter" data-i="enter">Начать обучение</button><p id="loginError" class="muted"></p></section><section id="academy" class="hide"><div class="card"><nav id="nav"></nav><h2 id="greeting"></h2><p id="status" class="muted"></p><div class="bar"><span id="progress" style="width:0%"></span></div><p><span id="points" class="pill">0 / 100</span></p></div><div id="panel"></div></section></main><footer>MedNurse Academy · Демонстрационная версия 1.0 · Обучение сестринскому делу</footer><script>
const $=id=>document.getElementById(id);const T={ru:{welcome:'Вход студента',name:'Фамилия и имя',code:'Индивидуальный код (выдаёт преподаватель)',privacy:'Используйте учебный код, а не ИИН. Не вводите данные пациентов.',enter:'Начать обучение',lecture:'Лекция',case:'Клинический кейс',game:'Игра',quiz:'Тест',journal:'Журнал',welcomeBack:'Студент',submit:'Ответить',next:'Следующий вопрос',finish:'Завершить',restart:'Начать заново',correct:'Верно!',wrong:'Неверно.',score:'Баллы',saved:'Результат отправлен',offline:'Результат сохранён только в этом браузере. Подключите Apps Script для централизованного журнала.',loginFail:'Укажите имя и код (не менее 4 символов).',notConfigured:'Сервер журнала пока не подключён.'},kk:{welcome:'Студенттің кіруі',name:'Тегі және аты',code:'Жеке код (оқытушы береді)',privacy:'ЖСН емес, оқу кодын пайдаланыңыз. Пациенттердің деректерін енгізбеңіз.',enter:'Оқуды бастау',lecture:'Дәріс',case:'Клиникалық жағдай',game:'Ойын',quiz:'Тест',journal:'Журнал',welcomeBack:'Студент',submit:'Жауап беру',next:'Келесі сұрақ',finish:'Аяқтау',restart:'Қайта бастау',correct:'Дұрыс!',wrong:'Қате.',score:'Ұпай',saved:'Нәтиже жіберілді',offline:'Нәтиже тек осы браузерде сақталды. Ортақ журнал үшін Apps Script қосыңыз.',loginFail:'Аты-жөніңізді және кемінде 4 таңбалы кодты енгізіңіз.',notConfigured:'Журнал сервері әлі қосылмаған.'}};
const DATA={ru:{title:'Физиотерапия: основы безопасного сестринского ухода',intro:'Физиотерапия использует физические факторы в составе реабилитации. Назначение процедуры, выбор параметров и оценка противопоказаний выполняются уполномоченным медицинским специалистом. Медицинская сестра проверяет назначение, идентифицирует пациента, объясняет процедуру, обеспечивает безопасность и фиксирует реакцию.',steps:['Проверить назначение, идентичность пациента и локальный протокол.','Уточнить самочувствие и возможные противопоказания; при сомнениях не начинать и сообщить ответственному специалисту.','Объяснить ход процедуры и получить согласие в соответствии с правилами организации.','Осмотреть оборудование и кожу в зоне воздействия, соблюдать электробезопасность.','Наблюдать за состоянием пациента; при боли, ожоге, головокружении остановить процедуру и вызвать помощь.','Задокументировать процедуру, реакцию и отклонения.'],case:'Пациент во время назначенной электротерапии жалуется на жжение под электродом. Что сделает медсестра в первую очередь?',caseOpts:['Увеличит интенсивность','Немедленно остановит воздействие, оценит состояние и сообщит специалисту','Попросит потерпеть','Оставит пациента одного'],caseWhy:'Жжение может указывать на повреждение кожи или проблему контакта. Продолжать воздействие небезопасно.',gameTitle:'Соберите безопасный алгоритм',gameItems:['Проверить назначение и идентификацию','Оценить состояние и подготовить пациента','Проверить оборудование и безопасность','Наблюдать во время процедуры','Задокументировать результат'],quizIntro:'Демонстрационный банк: 12 вопросов, по 6 случайных за попытку. Для 30 вопросов необходимо расширить банк.',questions:[['Кто определяет параметры физиотерапевтического воздействия?',['Пациент','Уполномоченный специалист согласно назначению','Любой посетитель','Студент самостоятельно'],1],['Что делать при внезапном головокружении во время процедуры?',['Продолжать','Остановить процедуру и оценить состояние','Увеличить мощность','Не обращать внимания'],1],['Какой документ проверяют до процедуры?',['Назначение','Расписание столовой','Пропуск','Список покупок'],0],['Что необходимо до контакта с пациентом?',['Гигиена рук','Включить аппарат на максимум','Снять маркировку','Закрыть журнал'],0],['Что фиксируют после процедуры?',['Только погоду','Проведение и реакцию пациента','Личные данные соседей','Ничего'],1],['Если оборудование повреждено, следует:',['Использовать осторожно','Не использовать и сообщить ответственному','Заклеить скотчем','Игнорировать'],1],['Кто должен быть идентифицирован перед процедурой?',['Пациент','Случайный посетитель','Только врач','Никто'],0],['Если пациент не понимает процедуру, медсестра должна:',['Объяснить доступно','Не отвечать','Ускорить процедуру','Уйти'],0],['При признаках ожога нужно:',['Остановить воздействие и организовать помощь','Продолжить','Усилить нагрев','Скрыть событие'],0],['Основная цель наблюдения во время процедуры:',['Раннее выявление нежелательной реакции','Ускорение работы','Экономия бумаги','Замена назначения'],0],['Что делать при сомнении в противопоказаниях?',['Уточнить у ответственного специалиста','Самостоятельно изменить назначение','Игнорировать','Попросить соседа решить'],0],['Что важно для электрической безопасности?',['Исправное оборудование и соблюдение инструкции','Влажные руки при работе с вилкой','Повреждённый кабель','Отсутствие проверки'],0]]},kk:{title:'Физиотерапия: қауіпсіз мейіргерлік күтім негіздері',intro:'Физиотерапия оңалтуда физикалық факторларды қолданады. Процедураны тағайындау, параметрлерін таңдау және қарсы көрсетілімдерді бағалау уәкілетті маманның міндеті. Мейіргер тағайындауды тексереді, пациентті сәйкестендіреді, түсіндіреді, қауіпсіздікті қамтамасыз етеді және реакциясын құжаттайды.',steps:['Тағайындауды, пациенттің сәйкестігін және жергілікті хаттаманы тексеру.','Жағдайын және ықтимал қарсы көрсетілімдерді нақтылау; күмән болса, жауапты маманға хабарлау.','Процедураны түсіндіріп, ұйым ережесіне сай келісім алу.','Аппаратты және әсер ету аймағындағы теріні тексеріп, электр қауіпсіздігін сақтау.','Пациентті бақылау; ауырсыну, күйік, бас айналу болса тоқтатып, көмек шақыру.','Процедура мен пациент реакциясын құжаттау.'],case:'Электротерапия кезінде пациент электрод астында күйдіру сезіміне шағымданды. Мейіргердің бірінші әрекеті?',caseOpts:['Қарқындылықты арттыру','Әсерді дереу тоқтатып, жағдайын бағалау және маманға хабарлау','Шыдауды сұрау','Пациентті жалғыз қалдыру'],caseWhy:'Күйдіру сезімі тері зақымдануын немесе электрод жанасуының бұзылуын көрсетуі мүмкін.',gameTitle:'Қауіпсіз әрекеттер ретін құрастырыңыз',gameItems:['Тағайындау мен сәйкестікті тексеру','Пациенттің жағдайын бағалау және дайындау','Аппарат пен қауіпсіздікті тексеру','Процедура барысында бақылау','Нәтижені құжаттау'],quizIntro:'Демо банк: 12 сұрақ, әр әрекетте кездейсоқ 6 сұрақ. 30 сұрақ үшін банкті толықтыру керек.',questions:[['Физиотерапиялық әсер параметрлерін кім анықтайды?',['Пациент','Тағайындауға сәйкес уәкілетті маман','Кез келген келуші','Студент өзі'],1],['Процедурада бас айналса не істеу керек?',['Жалғастыру','Тоқтатып, жағдайын бағалау','Қуатты арттыру','Елемеу'],1],['Процедура алдында не тексеріледі?',['Тағайындау','Асхана кестесі','Рұқсатнама','Сатып алу тізімі'],0],['Пациентпен байланыс алдында не қажет?',['Қол гигиенасы','Аппаратты ең жоғары деңгейге қосу','Белгіні алып тастау','Журналды жабу'],0],['Процедурадан соң не тіркеледі?',['Ауа райы','Орындалуы және пациент реакциясы','Басқа адамдардың деректері','Ештеңе'],1],['Аппарат зақымданса:',['Абайлап қолдану','Қолданбау және жауапты адамға хабарлау','Скотчпен жабыстыру','Елемеу'],1],['Процедура алдында кімді сәйкестендіреді?',['Пациентті','Кездейсоқ келушіні','Тек дәрігерді','Ешкімді'],0],['Пациент процедураны түсінбесе:',['Түсінікті етіп түсіндіру','Жауап бермеу','Асықтыру','Кетіп қалу'],0],['Күйік белгісі болса:',['Әсерді тоқтатып, көмек ұйымдастыру','Жалғастыру','Қыздыруды күшейту','Жасыру'],0],['Бақылаудың негізгі мақсаты:',['Жағымсыз реакцияны ерте анықтау','Жұмысты тездету','Қағаз үнемдеу','Тағайындауды алмастыру'],0],['Қарсы көрсетілімге күмән болса:',['Жауапты маманнан нақтылау','Тағайындауды өз бетінше өзгерту','Елемеу','Көршіден сұрау'],0],['Электр қауіпсіздігі үшін не маңызды?',['Жарамды аппарат және нұсқаулықты сақтау','Ылғал қолмен ашаны ұстау','Зақымданған сым','Тексермеу'],0]]}};
let lang='ru',student=null,points={lecture:0,case:0,game:0,quiz:0},attempt=[],idx=0,chosen=null,answered=false,gamePos=0;const labels=['lecture','case','game','quiz','journal'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function t(k){return T[lang][k]}function d(){return DATA[lang]}function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(x=>x.textContent=t(x.dataset.i));$('subtitle').textContent='Реабилитология / Оңалту · СД-381';if(student)show(current)}let current='lecture';$('lang').onchange=e=>{lang=e.target.value;applyLang()};$('enter').onclick=()=>{const name=$('student').value.trim(),code=$('code').value.trim();if(name.length<3||code.length<4){$('loginError').textContent=t('loginFail');return}student={name,code};$('login').classList.add('hide');$('academy').classList.remove('hide');applyLang()};function update(){const sum=Object.values(points).reduce((a,b)=>a+b,0);$('points').textContent=t('score')+': '+sum+' / 100';$('progress').style.width=sum+'%';$('greeting').textContent=t('welcomeBack')+': '+student.name;$('status').textContent='СД-381 · '+d().title}function show(which){current=which;update();$('nav').innerHTML=labels.map(k=>`<button class="${k===which?'active':''}" data-tab="${k}">${t(k)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));if(which==='lecture')lecture();if(which==='case')caseView();if(which==='game')gameView();if(which==='quiz')quizView();if(which==='journal')journalView()}function lecture(){$('panel').innerHTML=`<div class="card"><h2>${esc(d().title)}</h2><p>${esc(d().intro)}</p><h3>${lang==='ru'?'Алгоритм сестринского сопровождения':'Мейіргерлік сүйемелдеу алгоритмі'}</h3><ol>${d().steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="notice">${lang==='ru'?'Учебный материал не заменяет назначение и локальные клинические протоколы.':'Оқу материалы тағайындау мен жергілікті клиникалық хаттамаларды алмастырмайды.'}</div><p><button id="doneLecture">${lang==='ru'?'Изучено (+10 баллов)':'Оқылды (+10 ұпай)'}</button></p></div>`;$('doneLecture').onclick=()=>{points.lecture=10;update();show('case')}}function caseView(){$('panel').innerHTML=`<div class="card"><h2>${t('case')}</h2><p class="q">${esc(d().case)}</p><div class="options">${d().caseOpts.map((x,i)=>`<button data-case="${i}">${esc(x)}</button>`).join('')}</div><div id="feedback"></div></div>`;document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.case)===1;points.case=ok?20:0;$('feedback').textContent=(ok?t('correct'):t('wrong'))+' '+d().caseWhy;update()})}function gameView(){$('panel').innerHTML=`<div class="card"><h2>${esc(d().gameTitle)}</h2><p>${lang==='ru'?'Нажимайте действия в правильном порядке. Ошибка сбрасывает последовательность.':'Әрекеттерді дұрыс ретпен басыңыз. Қате болса, реттілік жаңарады.'}</p><p id="gameStatus">${gamePos} / 5</p><div class="options" id="gameOpts"></div><p><button id="resetGame">${t('restart')}</button></p></div>`;$('resetGame').onclick=()=>{gamePos=0;gameView()};let order=[2,0,4,1,3];$('gameOpts').innerHTML=order.map(i=>`<button data-step="${i}" ${i<gamePos?'disabled':''}>${esc(d().gameItems[i])}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.step)===gamePos){gamePos++;if(gamePos===5){points.game=20;update();alert(t('correct'))}gameView()}else{gamePos=0;gameView()}})}function startQuiz(){window.quizCorrect=0;attempt=[...d().questions.keys()].sort(()=>Math.random()-.5).slice(0,6);idx=0;chosen=null;answered=false;quizView()}function quizView(){if(!attempt.length){$('panel').innerHTML=`<div class="card"><h2>${t('quiz')}</h2><p>${esc(d().quizIntro)}</p><button id="startQuiz">${lang==='ru'?'Начать тест':'Тестті бастау'}</button></div>`;$('startQuiz').onclick=startQuiz;return}if(idx>=attempt.length){finishQuiz();return}const q=d().questions[attempt[idx]];$('panel').innerHTML=`<div class="card"><h2>${t('quiz')} · ${idx+1}/${attempt.length}</h2><p class="q">${esc(q[0])}</p><div class="options">${q[1].map((x,i)=>`<button data-answer="${i}" class="${chosen===i?'selected':''}">${esc(x)}</button>`).join('')}</div><p id="feedback"></p><p><button id="confirm" ${chosen===null?'disabled':''}>${answered?t('next'):t('submit')}</button></p></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;chosen=Number(b.dataset.answer);quizView()});$('confirm').onclick=()=>{if(!answered){answered=true;const ok=chosen===q[2];if(!window.quizCorrect)window.quizCorrect=0;if(ok)window.quizCorrect++;$('feedback').textContent=ok?t('correct'):t('wrong');$('confirm').textContent=t('next')}else{idx++;chosen=null;answered=false;quizView()}}}async function finishQuiz(){points.quiz=Math.round((window.quizCorrect||0)/6*50);const score=Object.values(points).reduce((a,b)=>a+b,0);const record={name:student.name,code:student.code,group:'СД-381',subject:'Реабилитология',lesson:'Физиотерапия',score,quizCorrect:window.quizCorrect||0,quizTotal:6,attemptId:crypto.randomUUID?crypto.randomUUID():String(Date.now())};const history=JSON.parse(localStorage.getItem('mednurse_records')||'[]');history.push({...record,at:new Date().toISOString()});localStorage.setItem('mednurse_records',JSON.stringify(history));let message=t('offline');if(window.MEDNURSE_SCRIPT_URL&&window.MEDNURSE_SCRIPT_URL.startsWith('https://script.google.com/macros/s/')){try{const res=await fetch(window.MEDNURSE_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(record)});const out=await res.json();if(out.ok)message=t('saved');else message+=' ('+(out.error||'server error')+')'}catch(e){message+=' ('+e.message+')'}}attempt=[];window.quizCorrect=0;$('panel').innerHTML=`<div class="card"><h2>${lang==='ru'?'Результат':'Нәтиже'}: ${score}/100</h2><p>${esc(message)}</p><p>${lang==='ru'?'Клинический кейс и игра могут быть выполнены повторно.':'Клиникалық жағдай мен ойынды қайта орындауға болады.'}</p><button id="again">${t('restart')}</button></div>`;$('again').onclick=startQuiz;update()}function journalView(){const history=JSON.parse(localStorage.getItem('mednurse_records')||'[]').filter(x=>x.code===student.code);$('panel').innerHTML=`<div class="card"><h2>${t('journal')}</h2><p class="muted">${lang==='ru'?'Локальная история этого устройства. Общий журнал хранится в Google Sheets после подключения сервера.':'Осы құрылғының жергілікті тарихы. Сервер қосылған соң ортақ журнал Google Sheets ішінде сақталады.'}</p><div style="overflow:auto"><table><thead><tr><th>Дата / Күні</th><th>Баллы / Ұпай</th><th>Тест</th></tr></thead><tbody>${history.map(r=>`<tr><td>${esc(new Date(r.at).toLocaleString())}</td><td>${r.score}/100</td><td>${r.quizCorrect}/${r.quizTotal}</td></tr>`).join('')}</tbody></table></div></div>`}
</script><script src="config.js"></script></body></html>
